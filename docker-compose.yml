# docker-compose.yml — FloodSOS Full System
# Chạy 1 lệnh để khởi động toàn bộ hệ thống: docker compose up -d
#
# Services:
#   mongodb          — MongoDB :27017
#   sos-backend      — Node.js Backend :3002
#   priority-api     — FastAPI Urgency Scoring :8765
#   routing-api      — FastAPI Flood-Aware Routing :8766
#   streamlit-dash   — Streamlit Dashboard Điều Phối :8501
#   streamlit-sos    — Streamlit SOS Map + Shelter :8502

version: "3.9"

services:

  # ─── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: floodsos-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - floodsos-net

  # ─── Node.js SOS Backend ──────────────────────────────────────────────────────
  sos-backend:
    build:
      context: ./FloodSOS-Complete/Sos-backend
      dockerfile: Dockerfile
    container_name: floodsos-backend
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGO_URI=mongodb://mongodb:27017/floodsos
      - PRIORITY_API_URL=http://priority-api:8765/predict
      - ROUTING_API_URL=http://routing-api:8766/route
      - OPENWEATHER_KEY=${OPENWEATHER_KEY:-3e3ec7e28ca89e66bac0a9ef59e5ab81}
    volumes:
      # Share realtime_outputs between Node.js and Python services
      - realtime_outputs:/app/../../Gop_app/realtime_outputs
      - ./FloodSOS-Complete/Sos-backend/uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - floodsos-net

  # ─── Priority API (FastAPI — Urgency Scoring) ─────────────────────────────────
  priority-api:
    build:
      context: ./Gop_app
      dockerfile: Dockerfile
    container_name: floodsos-priority-api
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "priority_api:app", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "8765:8765"
    volumes:
      - ./Gop_app:/app
      - realtime_outputs:/app/realtime_outputs
    networks:
      - floodsos-net

  # ─── Routing API (FastAPI — Flood-Aware Routing) ──────────────────────────────
  routing-api:
    build:
      context: ./Gop_app
      dockerfile: Dockerfile
    container_name: floodsos-routing-api
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "routing_api:app", "--host", "0.0.0.0", "--port", "8766"]
    ports:
      - "8766:8766"
    volumes:
      - ./Gop_app:/app
      - realtime_outputs:/app/realtime_outputs
    networks:
      - floodsos-net

  # ─── Streamlit Dashboard Điều Phối ───────────────────────────────────────────
  streamlit-dash:
    build:
      context: ./Gop_app
      dockerfile: Dockerfile
    container_name: floodsos-streamlit-dash
    restart: unless-stopped
    command: ["uv", "run", "streamlit", "run", "app6.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./Gop_app:/app
      - realtime_outputs:/app/realtime_outputs
    networks:
      - floodsos-net

  # ─── Streamlit SOS Map + Shelter ─────────────────────────────────────────────
  streamlit-sos:
    build:
      context: ./Gop_app
      dockerfile: Dockerfile
    container_name: floodsos-streamlit-sos
    restart: unless-stopped
    command: ["uv", "run", "streamlit", "run", "app_SOS_shelters7.py", "--server.port", "8502", "--server.address", "0.0.0.0"]
    ports:
      - "8502:8502"
    volumes:
      - ./Gop_app:/app
      - realtime_outputs:/app/realtime_outputs
    networks:
      - floodsos-net

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  # Named volume để chia sẻ thư mục realtime_outputs giữa các services
  realtime_outputs:
    driver: local

# ─── Network ──────────────────────────────────────────────────────────────────
networks:
  floodsos-net:
    driver: bridge
